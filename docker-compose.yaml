services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: house-price-prediction-api:local
    restart: unless-stopped
    ports:
      - "30001:30000"

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    restart: unless-stopped
    user: root
    ports:
      - 8081:8080
      - 50000:50000
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
